services:
  - type: web
    name: mindvault-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set manually in Render dashboard
      - key: DATA_DIR
        value: /tmp/data     # Ephemeral storage on free tier
      - key: PYTHON_VERSION
        value: 3.11.0
